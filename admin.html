<!-- Custom Dynamic Setting Creator -->
<div class="section">
    <h3>🛠️ Add / Modify Any Custom Setting</h3>
    <input type="text" id="customKey" placeholder="Setting Name (e.g. maintenanceMode, telegramLink)">
    <input type="text" id="customValue" placeholder="Setting Value (e.g. true, https://t.me/...)">
    <button onclick="saveCustomSetting()">Save Custom Setting</button>
</div>

<script>
    async function saveCustomSetting() {
        const key = document.getElementById('customKey').value;
        const value = document.getElementById('customValue').value;
        
        const res = await fetch('/admin/custom-setting', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ key, value })
        });
        const data = await res.json();
        if(res.ok) {
            alert(data.message);
            document.getElementById('customKey').value = '';
            document.getElementById('customValue').value = '';
        } else {
            alert(data.error);
        }
    }
  </script>
