<div class="cyber-card" style="background: #121526; border: 1px solid #00f0ff; border-radius: 14px; padding: 15px; box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);">
    <h4 style="color: #ff2a85; margin-top: 0;">Community Group Chat</h4>
    <p style="font-size: 11px; color: #8a8d9f; margin-bottom: 10px;">Note: Sharing links or phone numbers is strictly prohibited and will trigger an instant warning.</p>
    
    <!-- Chat Messages Box -->
    <div id="chat-messages" style="height: 220px; overflow-y: scroll; background: #0d0f18; padding: 10px; border: 1px solid #1a1e33; border-radius: 6px; margin-bottom: 10px; font-size: 13px; color: #fff;">
        Loading messages...
    </div>

    <!-- Input & Send Button -->
    <input type="text" id="chat-input" placeholder="Type your message..." style="width: 100%; padding: 10px; margin: 8px 0; background: #1a1e33; border: 1px solid #00f0ff; color: #fff; border-radius: 6px; box-sizing: border-box;">
    <button class="action-btn" onclick="sendChatMessage()" style="width: 100%; padding: 11px; background: linear-gradient(45deg, #ff2a85, #7928ca); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 0 10px rgba(255, 42, 133, 0.4);">Send Message</button>
</div>

<script>
    const chatToken = localStorage.getItem('token');

    async function loadChat() {
        try {
            const res = await fetch('/chat/messages', { headers: { 'Authorization': 'Bearer ' + chatToken } });
            const data = await res.json();
            const box = document.getElementById('chat-messages');
            if(res.ok) {
                box.innerHTML = data.messages.map(m => `<div style="margin-bottom: 6px;"><b>${m.name}:</b> ${m.text}</div>`).join('');
                box.scrollTop = box.scrollHeight;
            }
        } catch(e) { console.log(e); }
    }

    async function sendChatMessage() {
        const text = document.getElementById('chat-input').value;
        if (!text) return;
        
        const res = await fetch('/chat/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + chatToken },
            body: JSON.stringify({ text })
        });
        const data = await res.json();
        
        if(res.ok) {
            document.getElementById('chat-input').value = '';
            loadChat();
        } else {
            // Show system warning alert if user tries to send link or phone number
            alert(data.error || 'Blocked by security filter!');
        }
    }

    // Refresh chat messages every 3 seconds
    setInterval(loadChat, 3000);
    loadChat();
  </script>
